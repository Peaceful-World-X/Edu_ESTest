[pytest]
# pytest配置文件

# 测试文件匹配模式
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 命令行选项
addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings

# 标记定义
markers =
    smoke: 冒烟测试（快速验证核心功能）
    boundary: 边界值测试
    validation: 参数验证测试
    integration: 集成测试
    slow: 运行较慢的测试

# 日志配置
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# 测试发现路径
testpaths = .

# 最小Python版本
minversion = 3.7
